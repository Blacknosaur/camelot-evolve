name: Camelot
options:
  bundleIdPrefix: com.camelot
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 83ZRPDHF3Y
    CODE_SIGN_STYLE: Automatic
targets:
  Camelot:
    type: application
    platform: iOS
    sources:
      - Camelot
      - path: Camelot/Resources/Models/BasketballDetector.mlpackage
        buildPhase: sources
      - path: Camelot/Resources/Models/MODEL_NOTICE.md
        buildPhase: resources
      - path: Camelot/Resources/Models/PitchRegions.mlpackage
        buildPhase: sources
      - path: Camelot/Resources/Models/PITCH_MODEL_NOTICE.md
        buildPhase: resources
      - path: Camelot/Resources/Models/edgetam_image_encoder_pos.mlpackage
        buildPhase: sources
      - path: Camelot/Resources/Models/edgetam_prompt_encoder.mlpackage
        buildPhase: sources
      - path: Camelot/Resources/Models/edgetam_mask_decoder_mem.mlpackage
        buildPhase: sources
      - path: Camelot/Resources/Models/edgetam_memory_attention.mlpackage
        buildPhase: sources
      - path: Camelot/Resources/Models/edgetam_memory_encoder.mlpackage
        buildPhase: sources
      - path: Camelot/Resources/Models/edgetam_no_mem_embed_f32.bin
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.camelot.evolve
        PRODUCT_NAME: Camelot
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Camelot/Info.plist
        API_HOST: 192.168.1.203
  CamelotCamera:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - CamelotCamera
      - Camelot/MultiCamProtocol.swift
      - Camelot/MultiCamSession.swift
      - Camelot/MultiCamSocketServer.swift
      - Camelot/MultiCamVideoCodec.swift
      - Camelot/MultiCamCaptureEngine.swift
      - Camelot/MultiCamFeedView.swift
      - Camelot/MultiCamPeerController.swift
      - Camelot/MultiCamPeerViews.swift
      - Camelot/DesignSystem.swift
      - Camelot/EventKind.swift
      - Camelot/EventTagStrip.swift
      - Camelot/CameraControls.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blacknosaur.camelot.camera
        PRODUCT_NAME: CamelotCamera
        DEVELOPMENT_TEAM: 9V4MJ8TDVJ
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CamelotCamera/Info.plist
  CamelotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CamelotUITests
    dependencies:
      - target: Camelot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.camelot.evolve.uitests
        DEVELOPMENT_TEAM: 83ZRPDHF3Y
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
  CamelotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CamelotTests
    dependencies:
      - target: Camelot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CamelotCamera:
    build:
      targets:
        CamelotCamera: all
  Camelot:
    build:
      targets:
        Camelot: all
    test:
      targets:
        - CamelotTests
        - CamelotUITests
