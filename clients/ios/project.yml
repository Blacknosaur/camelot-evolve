name: Camelot
options:
  bundleIdPrefix: com.camelot
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 83ZRPDHF3Y
    CODE_SIGN_STYLE: Automatic
targets:
  Camelot:
    type: application
    platform: iOS
    sources:
      - Camelot
      - path: Camelot/Resources/Models/BasketballDetector.mlpackage
        buildPhase: sources
      - path: Camelot/Resources/Models/MODEL_NOTICE.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.camelot.evolve
        PRODUCT_NAME: Camelot
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Camelot/Info.plist
        API_HOST: 192.168.1.203
  CamelotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CamelotUITests
    dependencies:
      - target: Camelot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.camelot.evolve.uitests
        DEVELOPMENT_TEAM: 83ZRPDHF3Y
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
  CamelotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CamelotTests
    dependencies:
      - target: Camelot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Camelot:
    build:
      targets:
        Camelot: all
    test:
      targets:
        - CamelotTests
        - CamelotUITests
